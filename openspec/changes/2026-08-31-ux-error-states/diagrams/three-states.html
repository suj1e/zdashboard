<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>错误反馈三态收口</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}.frame{max-width:1200px;width:100%}.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;margin-bottom:1.5rem}svg{width:100%;min-width:900px;display:block}</style></head>
<body><div class="frame"><p class="eyebrow">2026-08-31-ux-error-states</p><h1>错误反馈三态收口</h1>
<svg viewBox="0 0 960 400" role="img" aria-labelledby="es-title es-desc"><title id="es-title">错误反馈三态收口</title><desc id="es-desc">流程图:数据请求经 fetchJson 门卫检查 r.ok,成功进入内容渲染,失败按有无旧数据分流到 ErrorState 重试或保留旧数据加轻提示。</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<defs><marker id="e1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="e2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker></defs>
<g font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">
<rect x="32" y="120" width="150" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="107" y="148" fill="#2d3142">数据请求</text><text x="107" y="166" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="9">fetchJson / fetchText</text>
<rect x="270" y="120" width="150" height="64" rx="6" fill="#eb6c36" opacity="0.08" stroke="#eb6c36"/><text x="345" y="148" fill="#2d3142">门卫:检查 res.ok</text><text x="345" y="166" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="9">HttpError(status)</text>
<rect x="520" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="600" y="72" fill="#2d3142">内容渲染(现路径)</text>
<rect x="520" y="130" width="160" height="72" rx="6" fill="#eb6c36" opacity="0.08" stroke="#eb6c36"/><text x="600" y="158" fill="#2d3142">ErrorState + 重试</text><text x="600" y="176" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="9">404 文件不存在 / 500 服务异常</text>
<rect x="520" y="236" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="600" y="268" fill="#2d3142">EmptyState 引导</text>
<rect x="760" y="130" width="168" height="72" rx="6" fill="rgba(79,93,117,0.05)" stroke="#4f5d75"/><text x="844" y="158" fill="#2d3142">三态可区分</text><text x="844" y="176" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="9">加载 / 错误 / 空数据</text>
</g>
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="182" y1="152" x2="270" y2="152" marker-end="url(#e1)"/>
<line x1="420" y1="140" x2="520" y2="72" marker-end="url(#e1)"/>
<line x1="420" y1="164" x2="520" y2="164" stroke="#eb6c36" marker-end="url(#e2)"/>
<line x1="420" y1="184" x2="520" y2="260" marker-end="url(#e1)"/>
<line x1="680" y1="166" x2="760" y2="166" marker-end="url(#e1)"/>
<line x1="680" y1="264" x2="760" y2="166" stroke-dasharray="5,4" marker-end="url(#e1)"/></g>
<g font-family="'Geist Mono',monospace" font-size="8" fill="#7a8399" text-anchor="middle">
<rect x="688" y="236" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="712" y="245">有旧数据</text></g>
<line x1="32" y1="336" x2="928" y2="336" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="32" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CHANGE</text>
<text x="120" y="360" fill="#4f5d75" font-size="10" font-family="'Geist',sans-serif">全部数据型 fetch 收口门卫 · 三态接线到 kit 组件 · 吞错点清零 · EmptyState 双实现合并</text>
</svg></div></body></html>
