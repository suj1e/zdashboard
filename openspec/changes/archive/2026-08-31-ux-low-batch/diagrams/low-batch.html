<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>UX 低优批次清单</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}.frame{max-width:1200px;width:100%}.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;margin-bottom:1.5rem}svg{width:100%;min-width:900px;display:block}</style></head>
<body><div class="frame"><p class="eyebrow">2026-08-31-ux-low-batch</p><h1>UX 低优批次清单</h1>
<svg viewBox="0 0 960 400" role="img" aria-labelledby="lb-title lb-desc"><title id="lb-title">UX 低优批次清单</title><desc id="lb-desc">清单图:低优批次四域——持久化、a11y、文案基线、日志小项,各域条目与前置依赖。</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<g font-family="'Geist',sans-serif" font-size="11">
<g><rect x="32" y="56" width="424" height="136" rx="8" fill="none" stroke="#2d3142" stroke-width="1"/>
<text x="48" y="80" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">持久化(safeStorage)</text>
<text x="48" y="104" fill="#2d3142">· view 折叠集合 zd-view-collapse</text>
<text x="48" y="128" fill="#2d3142">· design 分组 zd-design-groups / 视口 zd-design-viewport</text>
<text x="48" y="152" fill="#2d3142">· ThemeToggle/main 裸 setItem → safeStorage</text>
<text x="48" y="176" fill="#2d3142">· 前置:ux-medium-polish</text></g>
<g><rect x="504" y="56" width="424" height="136" rx="8" fill="none" stroke="#2d3142" stroke-width="1"/>
<text x="520" y="80" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">a11y</text>
<text x="520" y="104" fill="#2d3142">· 树/目录 aria-expanded</text>
<text x="520" y="128" fill="#2d3142">· 日志 role=log + tabIndex + aria-live</text>
<text x="520" y="152" fill="#2d3142">· IconButton 热区 ≥24px</text>
<text x="520" y="176" fill="#2d3142">· prefers-reduced-motion 全局关闭 pulse/scale</text></g>
<g><rect x="32" y="208" width="424" height="112" rx="8" fill="none" stroke="#2d3142" stroke-width="1"/>
<text x="48" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">文案基线</text>
<text x="48" y="256" fill="#2d3142">· 状态形容词一律中文:clean → 干净</text>
<text x="48" y="280" fill="#2d3142">· 专有名词/命令保留英文(Just Runner 例外明知)</text>
<text x="48" y="304" fill="#2d3142">· 基线写入 design.md 备查</text></g>
<g><rect x="504" y="208" width="424" height="112" rx="8" fill="none" stroke="#2d3142" stroke-width="1"/>
<text x="520" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">日志小项</text>
<text x="520" y="256" fill="#2d3142">· \r 进度条分段推送(前端回写或快照,实施定)</text>
<text x="520" y="280" fill="#2d3142">· logs EventSource 并入共享 /__reload 频道</text>
<text x="520" y="304" fill="#2d3142">· 前置:just-log-ux(日志区改造之上)</text></g>
</g>
<line x1="32" y1="344" x2="928" y2="344" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="32" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">NOTE</text>
<text x="100" y="368" fill="#4f5d75" font-size="10" font-family="'Geist',sans-serif">前置:ux-medium-polish(避免同文件冲突)与 just-log-ux;单项皆小,合并清账</text>
</svg></div></body></html>
