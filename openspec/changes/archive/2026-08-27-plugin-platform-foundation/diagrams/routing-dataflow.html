<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 路由数据流</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>URL 路由数据流</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zdroute-title zdroute-desc">
      <title id="zdroute-title">URL 路由数据流</title>
      <desc id="zdroute-desc">searchParams 从地址栏经 router 钩子流入 App 与 PluginPage,前进后退经 popstate 回流;旧的 hash 加 navToken 机制被删除。</desc>
      <defs>
        <marker id="zdroute-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="zdroute-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows first -->
      <!-- A → B : parse -->
      <path d="M224,232 H280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#zdroute-arrow)"/>
      <rect x="228" y="206" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="215" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARSE</text>

      <!-- B → C : route.plugin -->
      <path d="M464,232 H520" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#zdroute-arrow-accent)"/>
      <rect x="468" y="206" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="494" y="215" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLUGIN</text>

      <!-- C → D : render -->
      <path d="M704,232 H760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#zdroute-arrow)"/>
      <rect x="708" y="206" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="732" y="215" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RENDER</text>

      <!-- D → B : navigate patch (dashed, return path below) -->
      <path d="M856,272 V336 H448 Q440,336 440,328 V276" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#zdroute-arrow)"/>
      <rect x="600" y="310" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="636" y="319" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NAVIGATE</text>

      <!-- history → B : popstate (dashed) -->
      <path d="M136,392 V340 Q136,332 144,332 H344 Q352,332 352,324 V276" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#zdroute-arrow)"/>
      <rect x="156" y="356" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="188" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POPSTATE</text>

      <!-- nodes -->
      <!-- A URL (input) -->
      <rect x="48" y="196" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="196" width="176" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="136" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">浏览器 URL</text>
      <text x="136" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">?p=view&amp;file=…</text>

      <!-- B router (focal) -->
      <rect x="288" y="196" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="196" width="176" height="72" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="376" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">router.ts · useRoute</text>
      <text x="376" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pushState · popstate</text>

      <!-- C App -->
      <rect x="528" y="196" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="196" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="616" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App · registry</text>
      <text x="616" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">route.plugin → 选插件</text>

      <!-- D PluginPage -->
      <rect x="768" y="196" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="768" y="196" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="856" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PluginPage</text>
      <text x="856" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">params 只重渲染消费方</text>

      <!-- history node (input) -->
      <rect x="48" y="392" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="392" width="176" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="136" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">history 前进 / 后退</text>
      <text x="136" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">刷新 · 分享深链接</text>

      <!-- deleted node -->
      <rect x="768" y="392" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="768" y="392" width="176" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="856" y="416" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" text-decoration="line-through">hash + navToken</text>
      <text x="856" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zd-dashboard-nav · 已删除</text>

      <!-- legend -->
      <line x1="48" y1="496" x2="944" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="144" y1="517" x2="176" y2="517" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#zdroute-arrow)"/>
      <text x="184" y="521" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">数据流</text>
      <line x1="280" y1="517" x2="312" y2="517" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#zdroute-arrow)"/>
      <text x="320" y="521" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">事件 / 回流</text>
      <line x1="440" y1="517" x2="472" y2="517" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#zdroute-arrow-accent)"/>
      <text x="480" y="521" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">插件选择(新)</text>
      <rect x="616" y="510" width="24" height="12" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="648" y="521" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">已删除机制</text>
      <text x="48" y="548" fill="#4f5d75" font-size="10" font-family="'Instrument Serif', serif" font-style="italic">params 变化只重渲染消费方 — 树滚动位置等状态得以保留,整页强制重挂载成为历史。</text>
    </svg>
  </div>
</body>
</html>
