<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>just 布局:前后对比</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">2026-08-28-just-inline-tasks</p>
    <h1>just 布局:前后对比</h1>
    <svg viewBox="0 0 960 480" role="img" aria-labelledby="justlayout-title justlayout-desc">
      <title id="justlayout-title">just 布局前后对比</title>
      <desc id="justlayout-desc">布局对比图:before 态侧边栏任务列表与主区 LogViewer 内嵌列表重复;after 态删除侧边栏,LogViewer 全宽承担唯一任务选择面。</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- BEFORE zone -->
      <rect x="32" y="64" width="424" height="312" rx="8" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="48" y="88" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BEFORE · ?p=just</text>
      <!-- IconRail -->
      <rect x="48" y="104" width="40" height="256" rx="6" fill="rgba(79,93,117,0.05)"/>
      <rect x="48" y="104" width="40" height="256" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="68" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rail</text>
      <!-- Sidebar (deleted) -->
      <rect x="104" y="104" width="120" height="256" rx="6" fill="rgba(45,49,66,0.02)"/>
      <rect x="104" y="104" width="120" height="256" rx="6" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="164" y="220" fill="#4f5d75" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" text-decoration="line-through">侧边栏</text>
      <text x="164" y="240" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">活跃任务列表</text>
      <text x="164" y="256" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(已删除)</text>
      <!-- LogViewer -->
      <rect x="240" y="104" width="200" height="256" rx="6" fill="#ffffff"/>
      <rect x="240" y="104" width="200" height="256" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LogViewer</text>
      <text x="340" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">内嵌任务列表(重复)</text>

      <!-- AFTER zone -->
      <rect x="504" y="64" width="424" height="312" rx="8" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="520" y="88" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AFTER · ?p=just</text>
      <!-- IconRail -->
      <rect x="520" y="104" width="40" height="256" rx="6" fill="rgba(79,93,117,0.05)"/>
      <rect x="520" y="104" width="40" height="256" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="540" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rail</text>
      <!-- LogViewer full width (focal) -->
      <rect x="576" y="104" width="336" height="256" rx="6" fill="#eb6c36" opacity="0.08"/>
      <rect x="576" y="104" width="336" height="256" rx="6" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="744" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LogViewer 全宽</text>
      <text x="744" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">内嵌任务列表 = 唯一选择面</text>
      <text x="744" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recipe/task param 语义不变</text>

      <!-- legend -->
      <line x1="32" y1="408" x2="928" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="112" y="420" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="430" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">保留组件</text>
      <rect x="248" y="420" width="24" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="280" y="430" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">删除</text>
      <rect x="344" y="420" width="24" height="14" rx="3" fill="#eb6c36" opacity="0.08"/>
      <rect x="344" y="420" width="24" height="14" rx="3" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="376" y="430" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">唯一选择面</text>
      <text x="472" y="430" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">SidebarFrame 按 plugin.Sidebar 判空自动收栏,布局层零改动</text>
    </svg>
  </div>
</body>
</html>
