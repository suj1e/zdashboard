<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>view 约定化扫描数据流</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">2026-08-28-view-convention-scan</p>
    <h1>view 约定化扫描数据流</h1>
    <svg viewBox="0 0 960 540" role="img" aria-labelledby="scanflow-title scanflow-desc">
      <title id="scanflow-title">view 约定化扫描数据流</title>
      <desc id="scanflow-desc">数据流图:当前分支与 .zworktree 各根经固定白名单 openspec/docs 扫描为文件树,经 /__files 与 /__worktrees 供侧边栏渲染;配置链路整体删除。</desc>
      <defs>
        <marker id="sf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="sf-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows first -->
      <!-- A 当前分支 → C scanTree -->
      <path d="M176 128 L228 128 Q236 128 236 136 L236 160 Q236 168 244 168 L264 168"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sf-arrow)"/>
      <rect x="184" y="108" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="202" y="117" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">ROOT</text>
      <!-- B worktrees → C -->
      <path d="M176 240 L228 240 Q236 240 236 232 L236 200 Q236 192 244 192 L264 192"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sf-arrow)"/>
      <rect x="184" y="244" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="253" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">WT ROOTS</text>
      <!-- C → D straight -->
      <line x1="440" y1="184" x2="528" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sf-arrow)"/>
      <!-- D → F straight -->
      <line x1="664" y1="184" x2="752" y2="184" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sf-arrow-link)"/>
      <rect x="684" y="164" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="708" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">TREE JSON</text>
      <!-- E /__worktrees → F wrap-around -->
      <path d="M440 340 L468 340 Q476 340 476 348 L476 432 Q476 440 484 440 L920 440 Q928 440 928 432 L928 200 Q928 192 920 192 L904 192"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sf-arrow-link)"/>
      <rect x="520" y="420" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="564" y="429" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">/__worktrees</text>
      <!-- F → G straight vertical -->
      <line x1="800" y1="216" x2="800" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sf-arrow)"/>
      <rect x="810" y="256" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="826" y="265" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">file</text>

      <!-- nodes -->
      <!-- A 当前分支 -->
      <rect x="32" y="96" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="32" y="96" width="144" height="64" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
      <text x="104" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">当前分支</text>
      <text x="104" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config.root</text>
      <!-- B worktree roots -->
      <rect x="32" y="208" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="32" y="208" width="144" height="64" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
      <text x="104" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">worktree 各根</text>
      <text x="104" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.zworktree/*</text>
      <!-- C scanTree (focal: 约定白名单) -->
      <rect x="264" y="152" width="176" height="64" rx="6" fill="#eb6c36" opacity="0.08"/>
      <rect x="264" y="152" width="176" height="64" rx="6" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="352" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">scanTree 白名单</text>
      <text x="352" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">['openspec','docs'] 固定</text>
      <!-- D /__files -->
      <rect x="528" y="152" width="136" height="64" rx="6" fill="#ffffff"/>
      <rect x="528" y="152" width="136" height="64" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="158" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="552" y="167" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET</text>
      <text x="596" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/__files</text>
      <text x="596" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">{ tree }</text>
      <!-- E /__worktrees -->
      <rect x="264" y="312" width="176" height="56" rx="6" fill="#ffffff"/>
      <rect x="264" y="312" width="176" height="56" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
      <rect x="272" y="318" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="288" y="327" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET</text>
      <text x="352" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/__worktrees</text>
      <!-- F Sidebar -->
      <rect x="752" y="152" width="152" height="64" rx="6" fill="rgba(79,93,117,0.05)"/>
      <rect x="752" y="152" width="152" height="64" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="828" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">侧边栏树</text>
      <text x="828" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">当前分支组 + wt 组</text>
      <!-- G Workspace -->
      <rect x="752" y="312" width="152" height="64" rx="6" fill="rgba(79,93,117,0.05)"/>
      <rect x="752" y="312" width="152" height="64" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="828" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workspace 预览</text>
      <text x="828" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">?file= /__file-content</text>
      <!-- X 配置链路(已删除) -->
      <rect x="264" y="416" width="176" height="48" rx="6" fill="rgba(45,49,66,0.02)"/>
      <rect x="264" y="416" width="176" height="48" rx="6" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="352" y="436" fill="#4f5d75" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" text-decoration="line-through">配置链路(已删除)</text>
      <text x="352" y="452" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manifest.config · usePluginConfig · 弹窗</text>

      <!-- legend -->
      <line x1="32" y1="492" x2="928" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="112" y="504" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="514" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">组件 / 路由</text>
      <rect x="248" y="504" width="24" height="14" rx="3" fill="#eb6c36" opacity="0.08"/>
      <rect x="248" y="504" width="24" height="14" rx="3" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="280" y="514" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">约定焦点</text>
      <rect x="368" y="504" width="24" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="400" y="514" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">已删除</text>
      <line x1="472" y1="511" x2="496" y2="511" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sf-arrow-link)"/>
      <text x="504" y="514" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">HTTP</text>
    </svg>
  </div>
</body>
</html>
