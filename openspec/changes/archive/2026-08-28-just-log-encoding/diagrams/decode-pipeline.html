<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>just 日志智能解码管线</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
    .aside { font-family:var(--font-serif); font-style:italic; font-size:0.875rem; color:var(--color-muted); margin-top:1rem; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">2026-08-28-just-log-encoding</p>
    <h1>just 日志智能解码管线</h1>
    <svg viewBox="0 0 960 440" role="img" aria-labelledby="justenc-title justenc-desc">
      <title id="justenc-title">just 日志智能解码管线</title>
      <desc id="justenc-desc">数据流图:子进程字节流先按 0x0a 字节切行(行界安全),每完整行先 UTF-8 严格解码,失败回退 GBK,正确文本进入任务缓冲与 SSE。</desc>
      <defs>
        <marker id="je-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="je-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows -->
      <line x1="192" y1="128" x2="280" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#je-arrow)"/>
      <line x1="424" y1="128" x2="512" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#je-arrow)"/>
      <!-- utf8 ok path -->
      <line x1="656" y1="160" x2="744" y2="160" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#je-arrow-accent)"/>
      <rect x="664" y="136" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="700" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UTF-8 OK</text>
      <!-- gbk fallback path -->
      <path d="M584 224 L584 288 Q584 296 592 296 L656 296" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#je-arrow)"/>
      <rect x="596" y="268" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="622" y="277" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">fallback</text>
      <line x1="792" y1="296" x2="856" y2="296" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#je-arrow-accent)"/>
      <!-- incomplete path -->
      <path d="M424 152 L432 152 Q440 152 440 160 L440 328 Q440 336 448 336 L512 336"
            fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#je-arrow)"/>
      <rect x="444" y="308" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="317" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">incomplete</text>

      <!-- nodes -->
      <rect x="32" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="112" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">子进程 stdout/stderr</text>
      <text x="112" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GBK(cmd) / UTF-8 混存</text>
      <rect x="280" y="96" width="144" height="64" rx="6" fill="#eb6c36" opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="352" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">字节级行切分</text>
      <text x="352" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">indexOf(0x0a) · 行界安全</text>
      <rect x="512" y="96" width="144" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="584" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UTF-8 严格解码</text>
      <text x="584" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TextDecoder</text>
      <text x="584" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fatal: true</text>
      <rect x="656" y="128" width="88" height="64" rx="6" fill="rgba(79,93,117,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="700" y="156" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">任务缓冲</text>
      <text x="700" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ SSE</text>
      <rect x="656" y="264" width="136" height="64" rx="6" fill="rgba(79,93,117,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="724" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">iconv-lite GBK</text>
      <text x="724" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cmd 码页回退</text>
      <rect x="856" y="264" width="72" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="892" y="292" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">入缓冲</text>
      <text x="892" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ SSE</text>
      <rect x="512" y="304" width="112" height="64" rx="6" fill="rgba(79,93,117,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="568" y="332" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pending 字节缓冲</text>
      <text x="568" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">跨 chunk 安全</text>

      <!-- legend -->
      <line x1="32" y1="392" x2="928" y2="392" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="414" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="112" y="402" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="412" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">处理阶段</text>
      <rect x="248" y="402" width="24" height="14" rx="3" fill="rgba(79,93,117,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="280" y="412" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">缓冲 / 存储</text>
      <rect x="384" y="402" width="24" height="14" rx="3" fill="#eb6c36" opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="416" y="412" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">核心改造点</text>
    </svg>
    <p class="aside">0x0a 在 UTF-8 续字节(≥0x80)与 GBK 尾字节(0x40–0xFE)中都不出现——按字节切行永远不会切开多字节字符。</p>
  </div>
</body>
</html>
