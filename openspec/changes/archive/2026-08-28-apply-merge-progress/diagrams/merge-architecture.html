<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>执行进度插件合并架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">2026-08-28-apply-merge-progress</p>
    <h1>执行进度插件合并架构</h1>

        </marker>
        <marker id="ma-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows -->
      <!-- Tab壳 → 单change tab -->
      <path d="M368 120 L368 132 Q368 140 360 140 L244 140 Q236 140 236 148 L236 168"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ma-arrow)"/>
      <!-- Tab壳 → 批量 tab -->
      <path d="M416 120 L416 132 Q416 140 424 140 L616 140 Q624 140 624 148 L624 168"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ma-arrow)"/>
      <!-- 单change → /__apply 直线 -->
      <line x1="236" y1="224" x2="236" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ma-arrow)"/>
      <!-- 批量 → batch.ts 直线 -->
      <line x1="624" y1="224" x2="624" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ma-arrow)"/>
      <!-- batch.ts → .zdev/apply 读 -->
      <path d="M632 360 L632 400 Q632 408 624 408 L440 408 Q432 408 432 416"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ma-arrow-accent)"/>
      <rect x="456" y="388" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="397" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">READ ONLY</text>
      <!-- SSE files → 批量 tab -->
      <path d="M800 324 L664 324 Q656 324 656 316 L656 224"
            fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ma-arrow)"/>

      <text x="236" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tasks 进度 · proposal/design</text>
      <!-- N3 批量 tab -->
      <rect x="544" y="168" width="160" height="56" rx="6" fill="#ffffff"/>

      <text x="624" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">graph · checkpoint · logs</text>

      <rect x="64" y="296" width="184" height="56" rx="6" fill="#ffffff"/>

      <text x="156" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/__apply · /__apply/change</text>

      <!-- N5 batch.ts 只读投影 (focal) -->
      <rect x="544" y="296" width="176" height="64" rx="6" fill="#eb6c36" opacity="0.08"/>

      <text x="632" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">batch.ts 只读投影</text>
      <text x="632" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/__apply/batch · graph · logs · plan</text>

      <rect x="336" y="416" width="176" height="64" rx="6" fill="rgba(79,93,117,0.05)"/>

      <!-- N7 SSE -->
      <rect x="800" y="296" width="128" height="56" rx="6" fill="rgba(45,49,66,0.02)"/>
      <rect x="800" y="296" width="128" height="56" rx="6" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
      <text x="864" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fs.watch</text>
      <text x="864" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reload · files 事件</text>
      <!-- N8 已删除 -->
      <rect x="64" y="416" width="208" height="56" rx="6" fill="rgba(45,49,66,0.02)"/>
      <rect x="64" y="416" width="208" height="56" rx="6" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="168" y="438" fill="#4f5d75" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" text-decoration="line-through">ApplyBatchStore · 7 条写路由</text>
      <text x="168" y="456" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">throttle · apply-batch 插件目录</text>
      <!-- N9 兼容注记 -->
      <rect x="800" y="168" width="128" height="56" rx="6" fill="rgba(45,49,66,0.02)"/>
      <rect x="800" y="168" width="128" height="56" rx="6" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="864" y="192" fill="#4f5d75" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">?p=apply-batch</text>
      <text x="864" y="210" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">未知 mode 回落首页</text>

      <!-- skill 写入标注 -->
      <text x="424" y="500" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zapply skill 写入 state.json · dashboard 只读,无双写</text>

      <!-- legend -->
      <line x1="32" y1="516" x2="928" y2="516" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="112" y="524" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="534" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">组件</text>
      <rect x="208" y="524" width="24" height="14" rx="3" fill="rgba(79,93,117,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="240" y="534" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">存储 / 视图</text>
      <rect x="336" y="524" width="24" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="368" y="534" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">外部 / 已删除</text>
    </svg>
  </div>
</body>
</html>
