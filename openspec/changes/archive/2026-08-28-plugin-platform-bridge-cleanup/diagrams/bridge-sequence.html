<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外部插件桥接时序</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>外部插件桥接时序</h1>

    <svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zdbridge-title zdbridge-desc">
      <title id="zdbridge-title">外部插件桥接时序</title>
      <desc id="zdbridge-desc">iframe 外部插件与宿主经 postMessage 握手并同步主题与导航;数据请求由宿主按白名单代理到服务端,白名单外拒绝。</desc>
      <defs>
        <marker id="zdbridge-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="zdbridge-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="zdbridge-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- actors -->
      <rect x="100" y="72" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">宿主</text>
      <text x="200" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ExternalWorkspace + bridge</text>

      <rect x="400" y="72" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">外部插件</text>
      <text x="500" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">iframe · allow-scripts</text>

      <rect x="700" y="72" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Server API</text>
      <text x="800" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">同源 /__*</text>

      <!-- lifelines -->
      <line x1="200" y1="120" x2="200" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="120" x2="500" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="120" x2="800" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- activation bars -->
      <rect x="196" y="152" width="8" height="416" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="496" y="152" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="496" y="312" width="8" height="256" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="408" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- 1. ready -->
      <path d="M496,160 H208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#zdbridge-arrow)"/>
      <rect x="320" y="136" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ZD:READY</text>

      <!-- 2. init (return) -->
      <path d="M196,200 H492" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#zdbridge-arrow)"/>
      <rect x="312" y="176" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ZD:INIT</text>

      <!-- 3. theme (async push) -->
      <path d="M204,240 H492" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#zdbridge-arrow-open)"/>
      <rect x="312" y="216" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="342" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ZD:THEME</text>

      <!-- 4. navigate (async) -->
      <path d="M496,280 H208" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#zdbridge-arrow-open)"/>
      <rect x="308" y="256" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="348" y="265" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ZD:NAVIGATE</text>

      <!-- 5. fetch request -->
      <path d="M496,320 H208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#zdbridge-arrow)"/>
      <rect x="312" y="296" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="344" y="305" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ZD:FETCH</text>

      <!-- ALT fragment -->
      <rect x="176" y="352" width="744" height="240" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="176" y="352" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="196" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="228" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[path 以 /__ 开头]</text>

      <!-- 6. GET server -->
      <path d="M204,416 H796" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#zdbridge-arrow)"/>
      <rect x="424" y="392" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="401" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /__STATS/DATA</text>

      <!-- 7. 200 JSON (return) -->
      <path d="M796,456 H208" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#zdbridge-arrow)"/>
      <rect x="448" y="432" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="441" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · JSON</text>

      <!-- 8. result to iframe (headline success, coral) -->
      <path d="M204,496 H492" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#zdbridge-arrow-accent)"/>
      <rect x="288" y="472" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="348" y="481" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ZD:FETCH:RESULT</text>

      <!-- divider -->
      <line x1="184" y1="520" x2="912" y2="520" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="228" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else]</text>

      <!-- 9. deny -->
      <path d="M204,568 H492" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#zdbridge-arrow)"/>
      <rect x="288" y="544" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="348" y="553" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">403 · 白名单外拒绝</text>

      <!-- legend -->
      <line x1="100" y1="644" x2="900" y2="644" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="100" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="196" y1="665" x2="228" y2="665" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#zdbridge-arrow)"/>
      <text x="236" y="669" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">调用</text>
      <line x1="312" y1="665" x2="344" y2="665" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#zdbridge-arrow)"/>
      <text x="352" y="669" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">返回</text>
      <line x1="432" y1="665" x2="464" y2="665" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#zdbridge-arrow-open)"/>
      <text x="472" y="669" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">异步推送</text>
      <line x1="588" y1="665" x2="620" y2="665" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#zdbridge-arrow-accent)"/>
      <text x="628" y="669" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">数据回传(关键路径)</text>
      <text x="100" y="700" fill="#4f5d75" font-size="10" font-family="'Instrument Serif', serif" font-style="italic">sandbox 去掉 allow-same-origin 后,zd:fetch 代理是外部插件获取数据的唯一通道 — 默认放行 /__ 前缀。</text>
    </svg>
  </div>
</body>
</html>
