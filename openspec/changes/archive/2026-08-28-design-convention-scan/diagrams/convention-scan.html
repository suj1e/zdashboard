<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>design 约定化扫描</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
    .aside { font-family: var(--font-serif); font-style: italic; font-size: 0.875rem; color: var(--color-muted); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">2026-08-28-design-convention-scan</p>
    <h1>design 约定化扫描</h1>
    <svg viewBox="0 0 960 460" role="img" aria-labelledby="designscan-title designscan-desc">
      <title id="designscan-title">design 约定化扫描</title>
      <desc id="designscan-desc">数据流图:.zdev/design 约定目录经 scanAssets 扫描为九类资产分组,经 /__design/assets 供侧边栏渲染;folders 配置与配置组件删除。</desc>
      <defs>
        <marker id="ds-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="ds-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows -->
      <line x1="192" y1="192" x2="280" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ds-arrow)"/>
      <line x1="424" y1="192" x2="512" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ds-arrow)"/>
      <line x1="656" y1="192" x2="744" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ds-arrow)"/>
      <line x1="820" y1="224" x2="820" y2="312" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ds-arrow-link)"/>
      <rect x="830" y="260" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="850" y="269" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">fetch</text>

      <!-- nodes -->
      <!-- A 约定根 (focal) -->
      <rect x="32" y="152" width="160" height="80" rx="6" fill="#eb6c36" opacity="0.08"/>
      <rect x="32" y="152" width="160" height="80" rx="6" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="112" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">.zdev/design/</text>
      <text x="112" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">brands/ · assets/</text>
      <text x="112" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">diagram-style.md</text>
      <!-- B scanAssets -->
      <rect x="280" y="160" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="280" y="160" width="144" height="64" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
      <text x="352" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">scanAssets()</text>
      <text x="352" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">缺失 → emptyScan()</text>
      <!-- C 九类分组 -->
      <rect x="512" y="160" width="144" height="64" rx="6" fill="rgba(79,93,117,0.05)"/>
      <rect x="512" y="160" width="144" height="64" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="584" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">九类分组</text>
      <text x="584" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">page·component·icon…</text>
      <!-- D route -->
      <rect x="744" y="160" width="152" height="64" rx="6" fill="#ffffff"/>
      <rect x="744" y="160" width="152" height="64" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
      <rect x="752" y="166" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="768" y="175" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET</text>
      <text x="820" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/__design/assets</text>
      <!-- E sidebar -->
      <rect x="744" y="312" width="152" height="56" rx="6" fill="rgba(79,93,117,0.05)"/>
      <rect x="744" y="312" width="152" height="56" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="820" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">侧边栏分组树</text>
      <text x="820" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">subscribe: files</text>
      <!-- X 已删除 -->
      <rect x="280" y="312" width="240" height="56" rx="6" fill="rgba(45,49,66,0.02)"/>
      <rect x="280" y="312" width="240" height="56" rx="6" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="400" y="334" fill="#4f5d75" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" text-decoration="line-through">folders 配置(已删除)</text>
      <text x="400" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ConfigField · usePluginConfig 孤儿删除</text>

      <!-- legend -->
      <line x1="32" y1="404" x2="928" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="112" y="416" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="426" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">组件 / 路由</text>
      <rect x="264" y="416" width="24" height="14" rx="3" fill="#eb6c36" opacity="0.08"/>
      <rect x="264" y="416" width="24" height="14" rx="3" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="296" y="426" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">约定目录</text>
      <rect x="392" y="416" width="24" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="424" y="426" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">已删除</text>
    </svg>
    <p class="aside">目录缺失时返回九组空数组,侧边栏呈现空态——约定缺席不再是配置问题。</p>
  </div>
</body>
</html>
