<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移除 market 插件</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">2026-08-28-remove-market-plugin</p>
    <h1>移除 market 插件</h1>
    <svg viewBox="0 0 960 330" role="img" aria-labelledby="marketrm-title marketrm-desc">
      <title id="marketrm-title">移除 market 插件</title>
      <desc id="marketrm-desc">组件图:before IconRail 六格含 market;after 五格,market 目录/注册/图标/spec 条目四路清理。</desc>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="32" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BEFORE · IconRail ×5</text>
      <g font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">
        <rect x="32" y="72" width="72" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="68" y="108" fill="#2d3142">stats</text>
        <rect x="120" y="72" width="72" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="156" y="108" fill="#2d3142">view</text>
        <rect x="208" y="72" width="72" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="244" y="108" fill="#2d3142">design</text>
        <rect x="296" y="72" width="72" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="332" y="108" fill="#2d3142">just</text>
        <rect x="384" y="72" width="72" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/><text x="420" y="108" fill="#7a8399" text-decoration="line-through">market</text>

      </g>

      <text x="592" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AFTER · IconRail ×4</text>
      <g font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">
        <rect x="592" y="72" width="72" height="64" rx="6" fill="#eb6c36" opacity="0.08" stroke="#eb6c36" stroke-width="1"/><text x="628" y="108" fill="#2d3142">stats</text>
        <rect x="680" y="72" width="72" height="64" rx="6" fill="#eb6c36" opacity="0.08" stroke="#eb6c36" stroke-width="1"/><text x="716" y="108" fill="#2d3142">view</text>
        <rect x="768" y="72" width="72" height="64" rx="6" fill="#eb6c36" opacity="0.08" stroke="#eb6c36" stroke-width="1"/><text x="804" y="108" fill="#2d3142">design</text>
        <rect x="856" y="72" width="72" height="64" rx="6" fill="#eb6c36" opacity="0.08" stroke="#eb6c36" stroke-width="1"/><text x="892" y="108" fill="#2d3142">just</text>

      </g>

      <text x="32" y="180" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">四路清理</text>
      <g font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75">
        <text x="32" y="204">1. src/plugins/market/ 整目录(25 文件)</text>
        <text x="32" y="226">2. cli.ts import + BUILTIN_PLUGINS 注册</text>
        <text x="32" y="248">3. manifests.test 契约行 · icons.tsx market 映射</text>
        <text x="32" y="270">4. spec REMOVED「灵感市场插件」(4 scenario)</text>
      </g>
      <text x="592" y="248" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">?p=market → 未知 mode 回落首页</text>
      <text x="592" y="270" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">外部插件机制(ext-plugins)不受影响</text>

      <line x1="32" y1="292" x2="928" y2="292" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="112" y="302" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="312" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">保留插件</text>
      <rect x="248" y="302" width="24" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="280" y="312" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">删除</text>
      <rect x="344" y="302" width="24" height="14" rx="3" fill="#eb6c36" opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="376" y="312" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">重构后 IconRail</text>
    </svg>
  </div>
</body>
</html>
