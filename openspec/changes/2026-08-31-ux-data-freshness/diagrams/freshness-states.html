<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>数据新鲜度状态机</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}.frame{max-width:1200px;width:100%}.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;margin-bottom:1.5rem}svg{width:100%;min-width:900px;display:block}</style></head>
<body><div class="frame"><p class="eyebrow">2026-08-31-ux-data-freshness</p><h1>数据新鲜度状态机</h1>
<svg viewBox="0 0 960 400" role="img" aria-labelledby="df-title df-desc"><title id="df-title">数据新鲜度状态机</title><desc id="df-desc">状态图:SSE 在线时文件事件触发重取;断线时数据标记 stale;重连成功逐频道补偿刷新;后台刷新失败保留旧数据仅记录错误。</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<defs><marker id="d1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="d2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker></defs>
<g font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">
<rect x="40" y="150" width="170" height="72" rx="6" fill="#eb6c36" opacity="0.08" stroke="#eb6c36"/><text x="125" y="180" fill="#2d3142">在线 · 实时</text><text x="125" y="200" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="9">files 事件 → 重取</text>
<rect x="300" y="40" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="390" y="68" fill="#2d3142">重取成功</text><text x="390" y="86" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="9">data 更新</text>
<rect x="300" y="150" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-dasharray="4,3"/><text x="390" y="178" fill="#2d3142">断线 · 数据标 stale</text><text x="390" y="196" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="9">变更被错过(旧行为:永久丢失)</text>
<rect x="580" y="150" width="170" height="64" rx="6" fill="#eb6c36" opacity="0.08" stroke="#eb6c36"/><text x="665" y="180" fill="#2d3142">重连成功(补偿)</text><text x="665" y="200" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="9">逐频道失效 → 全量重取</text>
<rect x="580" y="264" width="170" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="665" y="292" fill="#2d3142">重取失败</text><text x="665" y="310" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="9">保留旧 data + 记 error</text>
</g>
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<path d="M210 186 L300 96" marker-end="url(#d1)"/>
<path d="M210 200 L300 172" marker-end="url(#d1)"/>
<line x1="480" y1="72" x2="580" y2="170" marker-end="url(#d1)"/>
<line x1="480" y1="196" x2="580" y2="180" stroke="#eb6c36" marker-end="url(#d2)"/>
<path d="M750 182 L840 182 L840 296 L750 296" fill="none" marker-end="url(#d1)"/></g>
<g font-family="'Geist Mono',monospace" font-size="8" fill="#7a8399"><text x="846" y="240">仅记 error</text><text x="846" y="252">不清 data</text></g>
<line x1="40" y1="352" x2="920" y2="352" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">FIX</text>
<text x="100" y="376" fill="#4f5d75" font-size="10" font-family="'Geist',sans-serif">断线不再永久丢变更(重连补偿) · 刷新失败不再清空好数据(stale-while-revalidate) · viewer 接入 files</text>
</svg></div></body></html>
